name: Intel cryptography wheel experiment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/intel-crypto-wheel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM_COMMIT: f97608f178d1ffeca59860195ab7da295f7c8e5f
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      UV_NO_CONFIG: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      OPENSSL_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Prepare isolated Python and build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install \
            --only-binary=:all: --no-deps uv==0.12.23
          uv="$RUNNER_TEMP/tools/bin/uv"
          "$uv" venv --managed-python --python 3.11 --seed \
            "$RUNNER_TEMP/build-env"
          "$uv" venv --managed-python --python 3.11 --seed \
            "$RUNNER_TEMP/test-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install \
            --only-binary=:all: \
            setuptools==84.0.0 cffi==2.1.1 maturin==1.15.0
          openssl_dir=$(brew --prefix openssl@3)
          test -s "$openssl_dir/lib/libcrypto.a"
          test -s "$openssl_dir/lib/libssl.a"
          echo "OPENSSL_DIR=$openssl_dir" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
          clang --version
          "$openssl_dir/bin/openssl" version
          "$RUNNER_TEMP/build-env/bin/python" -m pip freeze

      - name: Fetch and verify source against upstream lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/wheelhouse"
          cd "$RUNNER_TEMP/source"
          echo "Fetching pinned upstream commit through Git"
          mkdir -p "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" init -q
          git -C "$RUNNER_TEMP/upstream" remote add origin \
            https://github.com/NousResearch/hermes-agent.git
          fetched=0
          for delay in 0 10 20 40; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if git -C "$RUNNER_TEMP/upstream" fetch \
              --depth=1 origin "$UPSTREAM_COMMIT"; then
              fetched=1
              break
            fi
          done
          test "$fetched" -eq 1
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse FETCH_HEAD)" \
            = "$UPSTREAM_COMMIT"
          git -C "$RUNNER_TEMP/upstream" show "$UPSTREAM_COMMIT:uv.lock" |
            cat > "$RUNNER_TEMP/source/uv.lock"
          echo "PASS: upstream lock retrieved from pinned commit"
          metadata=$("$RUNNER_TEMP/build-env/bin/python" -c '
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("uv.lock").read_text())
          packages = [p for p in data["package"]
                      if p["name"] == "cryptography" and p["version"] == "50.0.0"]
          assert len(packages) == 1, "Unexpected cryptography lock entry"
          source = packages[0]["sdist"]
          assert source["url"].startswith("https://files.pythonhosted.org/")
          assert source["hash"].startswith("sha256:")
          print(source["url"], source["hash"].split(":", 1)[1])
          ')
          read -r source_url source_hash <<< "$metadata"
          test "${#source_hash}" -eq 64
          printf 'Downloading cryptography source: %s\n' "$source_url"
          downloaded=0
          for delay in 0 10 20 40; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              "$source_url" |
              cat > "$RUNNER_TEMP/source/cryptography-50.0.0.tar.gz"; then
              downloaded=1
              break
            fi
            echo "Source download failed; retry budget is limited."
          done
          test "$downloaded" -eq 1
          printf '%s  cryptography-50.0.0.tar.gz\n' "$source_hash" |
            shasum -a 256 -c -

      - name: Record build inputs and OpenSSL provenance
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wheelhouse/provenance"
          mkdir -p "$evidence"
          "$OPENSSL_DIR/bin/openssl" version |
            grep -E '^OpenSSL 3\.6\.3([[:space:]]|$)'

          "$RUNNER_TEMP/build-env/bin/python" - << 'PY' |
          import hashlib
          import json
          import os
          import pathlib
          import platform
          from datetime import datetime, timezone

          root = pathlib.Path(os.environ["OPENSSL_DIR"]).resolve()
          receipt = root / "INSTALL_RECEIPT.json"
          assert receipt.is_file(), "Missing Homebrew installation receipt"
          raw_receipt = receipt.read_bytes()
          receipt_data = json.loads(raw_receipt)
          libraries = []
          for name in ("libcrypto.a", "libssl.a"):
              path = root / "lib" / name
              raw = path.read_bytes()
              assert raw
              libraries.append({
                  "path": str(path),
                  "size": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          notices = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              if not path.name.lower().startswith(
                  ("license", "licence", "notice", "copying")
              ):
                  continue
              raw = path.read_bytes()
              assert len(raw) <= 2_000_000
              notices.append({
                  "path": str(path.relative_to(root)),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "text": raw.decode("utf-8"),
              })
          assert notices, "No OpenSSL installation notices found"
          source = (
              pathlib.Path(os.environ["RUNNER_TEMP"])
              / "source/cryptography-50.0.0.tar.gz"
          )
          print(json.dumps({
              "schema_version": 1,
              "scope": "Inputs observed in this build; not evidence for an older wheel",
              "time_utc": datetime.now(timezone.utc).isoformat(),
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "upstream_commit": os.environ["UPSTREAM_COMMIT"],
              "runner_image": os.environ.get("ImageOS"),
              "runner_image_version": os.environ.get("ImageVersion"),
              "machine": platform.machine(),
              "macos": platform.mac_ver()[0],
              "python": platform.python_version(),
              "deployment_target": os.environ["MACOSX_DEPLOYMENT_TARGET"],
              "openssl_static": os.environ["OPENSSL_STATIC"],
              "openssl_prefix": str(root),
              "receipt_sha256": hashlib.sha256(raw_receipt).hexdigest(),
              "homebrew_receipt": receipt_data,
              "static_libraries": libraries,
              "installed_notices": notices,
              "cryptography_source_sha256": hashlib.sha256(
                  source.read_bytes()
              ).hexdigest(),
          }, ensure_ascii=False, indent=2))
          PY
            cat > "$evidence/build-inputs.json"

          {
            sw_vers
            brew --version
            rustc -Vv
            cargo --version
            clang --version
            xcrun --show-sdk-version
            "$OPENSSL_DIR/bin/openssl" version -a
            "$RUNNER_TEMP/build-env/bin/python" -m pip freeze
          } | cat > "$evidence/toolchain.txt"

          shasum -a 256 \
            "$OPENSSL_DIR/lib/libcrypto.a" \
            "$OPENSSL_DIR/lib/libssl.a" |
            cat > "$evidence/STATIC_LIBRARIES.sha256"

      - name: Build static OpenSSL wheel
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/build-env/bin:$PATH"
          test "$(command -v maturin)" = "$RUNNER_TEMP/build-env/bin/maturin"
          maturin --version
          "$RUNNER_TEMP/build-env/bin/python" -m pip wheel \
            --no-cache-dir --no-deps --no-build-isolation --no-index \
            --wheel-dir "$RUNNER_TEMP/wheelhouse" \
            "$RUNNER_TEMP/source/cryptography-50.0.0.tar.gz"

      - name: Install wheel into separate test environment
        run: |
          set -euo pipefail
          wheels=("$RUNNER_TEMP"/wheelhouse/cryptography-*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          "$RUNNER_TEMP/test-env/bin/python" -m pip install \
            --only-binary=:all: cffi==2.0.0 pycparser==3.0
          "$RUNNER_TEMP/test-env/bin/python" -m pip install \
            --no-index --no-deps "${wheels[0]}"

      - name: Audit native library dependencies
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/test-env/bin/python" - << 'PY'
          import pathlib
          import subprocess
          import cryptography

          root = pathlib.Path(cryptography.__file__).parent
          modules = sorted(root.rglob("*.so")) + sorted(root.rglob("*.dylib"))
          assert modules, "No native modules found"
          for module in modules:
              output = subprocess.check_output(
                  ["otool", "-L", str(module)], text=True
              )
              print(output)
              identity_output = subprocess.check_output(
                  ["otool", "-D", str(module)], text=True
              )
              identities = [
                  line.strip()
                  for line in identity_output.splitlines()[1:]
                  if line.strip()
              ]
              assert len(identities) <= 1, (
                  f"Unexpected library identities: {identities}"
              )
              entries = [
                  line.strip().split(" (", 1)[0]
                  for line in output.splitlines()[1:]
                  if line.strip()
              ]
              if identities:
                  assert entries and entries[0] == identities[0], (
                      "Library identity does not match first otool -L entry"
                  )
                  print(f"Library identity (not an import): {identities[0]}")
                  entries = entries[1:]
              assert entries, "No dynamic dependencies found; inspect output"
              for dependency in entries:
                  assert dependency.startswith(
                      ("/usr/lib/", "/System/Library/")
                  ), f"Non-system dynamic dependency: {dependency}"
          print("PASS: native modules reference only system dynamic libraries")
          PY

      - name: Test encryption and signatures
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/test-env/bin/python" - << 'PY'
          import cryptography
          from cryptography.fernet import Fernet
          from cryptography.hazmat.backends.openssl.backend import backend
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          assert cryptography.__version__ == "50.0.0"
          message = b"LocalVRAM Intel wheel experiment"
          cipher = Fernet(Fernet.generate_key())
          assert cipher.decrypt(cipher.encrypt(message)) == message
          private_key = Ed25519PrivateKey.generate()
          private_key.public_key().verify(private_key.sign(message), message)
          print("cryptography:", cryptography.__version__)
          print("OpenSSL:", backend.openssl_version_text())
          print("PASS: encryption, decryption and signature verification")
          PY
          "$RUNNER_TEMP/test-env/bin/python" -m pip check
          cd "$RUNNER_TEMP/wheelhouse"
          shasum -a 256 *.whl | cat > "$RUNNER_TEMP/wheelhouse/SHA256SUMS"
          cat "$RUNNER_TEMP/wheelhouse/SHA256SUMS"

      - name: Verify build inputs remained unchanged
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wheelhouse/provenance"
          shasum -a 256 -c "$evidence/STATIC_LIBRARIES.sha256"
          cd "$RUNNER_TEMP/wheelhouse"
          shasum -a 256 \
            *.whl SHA256SUMS \
            provenance/build-inputs.json \
            provenance/toolchain.txt \
            provenance/STATIC_LIBRARIES.sha256 |
            cat > BUILD_SHA256SUMS

      - name: Save experimental wheel
        uses: actions/upload-artifact@v4
        with:
          name: experimental-cryptography-50-macos15-intel-provenance
          path: ${{ runner.temp }}/wheelhouse/
          if-no-files-found: error
          retention-days: 30
