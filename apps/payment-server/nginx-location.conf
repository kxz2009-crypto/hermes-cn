# Include inside the existing HTTPS server block after deployment review.
# Mini-program apiBase: https://hermes.localvram.cn/api/install
location ^~ /api/install/admin/ { return 404; }
location /api/install/ {
    proxy_pass http://127.0.0.1:3021/;
    proxy_set_header Host $host;
    proxy_read_timeout 45s;
    client_max_body_size 16k;
    # Configure a dedicated limit_req_zone upstream for public endpoints.
}
